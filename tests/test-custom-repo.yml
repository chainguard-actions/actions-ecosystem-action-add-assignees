name: Test custom repo input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Add assignee with explicit repo
        id: add_assignees
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          assignees: octocat
          repo: actions-ecosystem/action-add-assignees
          number: 1

      - name: Assert action ran (success or graceful failure on non-existent issue)
        env:
          OUTCOME: ${{ steps.add_assignees.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (issue may not exist or token lacks permission)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
